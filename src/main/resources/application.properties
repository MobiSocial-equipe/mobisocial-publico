spring.application.name=mobisocial-core
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (ADR 03 - schemas: users, rides, payments, notifications)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:mobisocial}
spring.datasource.username=${POSTGRES_USER:mobisocial}
spring.datasource.password=${POSTGRES_PASSWORD:mobisocial}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway (gerenciamento de migrations SQL em db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# RabbitMQ / AMQP (ADR 02)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:guest}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Filas RabbitMQ (conformidade C4 - docs/c4/workspace.dsl e ADR 02)
mobisocial.rabbitmq.queues.payments-process=payments.process
mobisocial.rabbitmq.queues.notifications-dispatch=notifications.dispatch
mobisocial.rabbitmq.queues.payments-process-dlq=payments.process.dlq
mobisocial.rabbitmq.queues.notifications-dispatch-dlq=notifications.dispatch.dlq
